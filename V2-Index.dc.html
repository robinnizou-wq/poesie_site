<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>R. Nizou — V2 index</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111;text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible{outline:2px solid #111;outline-offset:3px}
button:hover{text-decoration:underline}
</style>
</helmet>
<div style="box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: flex-start; background: #f7f4ee; color: #111; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; line-height: 1.6; text-align: left">

<aside style="box-sizing: border-box; flex: 0 0 280px; padding: 40px 0 40px clamp(20px, 5vw, 64px); display: flex; flex-direction: column; align-items: flex-start; gap: 36px">
<h1 style="margin: 0; font-size: 28px; font-weight: 500; letter-spacing: 0.05em">R. Nizou</h1>
<nav aria-label="Navigation principale" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; font-size: 18px; letter-spacing: 0.04em">
<a href="#accueil" aria-current="page">Accueil</a>
<a href="#accueil" style="color: #5c574f">Rumeur des agencements</a>
<a href="#accueil" style="color: #5c574f">Actualités</a>
<a href="#accueil" style="color: #5c574f">Contact</a>
</nav>
</aside>

<main id="accueil" style="box-sizing: border-box; flex: 999 1 520px; min-width: 0; padding: 40px clamp(20px, 5vw, 64px) 140px 0">
<div style="max-width: 680px; margin: 0">

<div style="padding-top: 56px">
<p style="margin: 0; font-style: italic; font-size: 26px; opacity: {{phraseOpacity}}; visibility: {{phraseVis}}; transition: opacity 0.9s, visibility 0.9s">Et la nuit sera un autre désert tombant sur le désert</p>
<button type="button" onClick="{{emerge}}" style="font: inherit; font-size: 18px; letter-spacing: 0.04em; background: none; border: none; color: #111; cursor: pointer; margin: 40px 0 0; padding: 4px 0; text-align: left">faire émerger</button>
<div aria-live="polite" style="margin-top: 48px; white-space: pre-line; opacity: {{poemOpacity}}; visibility: {{poemVis}}; transition: opacity 1.2s">
<p style="margin: 0">{{poem}}</p>
<span style="display: block; margin-top: 18px; font-size: 16px; color: #5c574f">{{poemDate}}</span>
</div>
</div>


</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  textes() {
    return [
      { date: 'novembre 2026', texte: `Je raserai Paris
et retrouverai le désert
la plaine la steppe l'étendue
sauvage que frappe le
vent

Le royaume de la poussière
sur les visages

Un peu de non-affecté
pour peindre un ciel plein
d'une orbite orange ronge
le vol des mouettes abîmées
l'espoir` },
      { date: 'novembre 2026', texte: `Les fenêtres d'or n'ont jamais autant briller
depuis de nouveau
à la mer

remis à l'hasardeuse rencontre
des corps du moi sans lampe

à l'inattendu à la pure loi

Que cette route de pesanteur
me porte de noeud en noeud

Contingent comme seul maître` },
      { date: 'novembre 2026', texte: `Le zinc comptoir réunit les lignes
cliquetis du soir
travestis d'essais à dire

le plus
l'ondulé
la main tendue
l'accolade complice d'un soupir
les larmes les larmes que l'on garde
pour soi` },
      { date: 'novembre 2026', texte: `Inéluctablement je retombe
sur le point fixe d'une tombe
qui m'entraîne invariant d'une même prière

Puisse la surprise me claquer
au visage du bout de sa fronde

Seul demeure le saule faiseur
le pauvre d'une terre de peste
les possibles boursouffleurs
d'embouchures

Et le retour inexacte
la pensée absente
le tombant` },
      { date: 'novembre 2026', texte: `Frapper une pierre
ramasser les joyaux du monde
cette carte à l'envers
coincée au trépas d'une page quelconque

Las de déplier les montagnes
j'embrasse la fin en tout
la lumière vacillante du pas trébuche
la peur d'une lèvre demi-obscure

Au fond d'une brèche
fondue` }
    ];
  }
  renderVals() {
    const T = this.textes();
    const i = (this.state && typeof this.state.i === 'number') ? this.state.i : -1;
    const on = i >= 0;
    const cur = on ? T[i] : { texte: '', date: '' };
    return {
      phraseOpacity: on ? 0 : 1,
      phraseVis: on ? 'hidden' : 'visible',
      poemOpacity: on ? 1 : 0,
      poemVis: on ? 'visible' : 'hidden',
      poem: cur.texte,
      poemDate: cur.date,
      emerge: () => {
        let n;
        do { n = Math.floor(Math.random() * T.length); } while (T.length > 1 && n === i);
        this.setState({ i: n });
      }
    };
  }
}
</script>
</body>
</html>
